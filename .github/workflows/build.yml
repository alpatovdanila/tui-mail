name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "textual==8.2.8" "markdownify==1.2.3"
      - run: python tests/acceptance.py

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: tuimail-windows
            sep: ';'
            arch: ''
          - os: macos-latest
            # one universal2 binary covers Apple Silicon and Intel; GitHub has
            # no Intel mac runners any more (macos-13 jobs queue forever)
            artifact: tuimail-macos-universal
            sep: ':'
            arch: '--target-arch universal2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "textual==8.2.8" "pyinstaller==6.22.2" "certifi==2026.1.4" "markdownify==1.2.3" "beautifulsoup4==4.14.3" "soupsieve==2.8.3"  # pinned: release binaries must not float
      - run: pyinstaller --onefile --console --name tuimail --collect-all textual --add-data "tuimail/app.tcss${{ matrix.sep }}tuimail" ${{ matrix.arch }} run.py
      - name: smoke test (posix)
        if: runner.os != 'Windows'
        run: ./dist/tuimail --check
      - name: smoke test (windows)
        if: runner.os == 'Windows'
        run: .\dist\tuimail.exe --check
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/tuimail*

  install-scripts:
    needs: test
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: installer smoke (macos)
        if: runner.os == 'macOS'
        run: |
          TUIMAIL_NO_PATH=1 sh install.sh
          "$HOME/.local/bin/tuimail" --check
      - name: installer smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TUIMAIL_NO_PATH = '1'
          ./install.ps1
          & "$env:LOCALAPPDATA\Programs\tuimail\tuimail.exe" --check

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: assemble assets
        run: |
          mkdir out
          mv art/tuimail-windows/tuimail.exe out/tuimail-windows.exe
          mv art/tuimail-macos-universal/tuimail out/tuimail-macos-universal
      - name: publish releases
        run: |
          notes_for() { awk -v v="$1" 'index($0, "## " v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md; }

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            NOTES="$(notes_for "$V")"
            gh release create "$GITHUB_REF_NAME" out/* \
              --title "tuimail $GITHUB_REF_NAME" --notes "${NOTES:-Release $GITHUB_REF_NAME}"
            exit 0
          fi

          # rolling dev build, clearly marked so versioned releases stay the face
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --prerelease --latest=false \
            --title 'tuimail latest (rolling dev build)' \
            --notes "Rolling build of main (${GITHUB_SHA::7}). For stable downloads use the newest versioned release."

          # first push carrying a new pyproject version -> cut the vX.Y.Z release
          VERSION=$(grep -Po '(?<=^version = ")[^"]+' pyproject.toml)
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            NOTES="$(notes_for "$VERSION")"
            gh release create "v$VERSION" out/* --target "$GITHUB_SHA" \
              --title "tuimail v$VERSION" --notes "${NOTES:-Release v$VERSION}"
          fi
