name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install textual
      - run: python tests/acceptance.py

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: tuimail-windows
            sep: ';'
            arch: ''
          - os: macos-latest
            # one universal2 binary covers Apple Silicon and Intel; GitHub has
            # no Intel mac runners any more (macos-13 jobs queue forever)
            artifact: tuimail-macos-universal
            sep: ':'
            arch: '--target-arch universal2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install textual pyinstaller
      - run: pyinstaller --onefile --console --name tuimail --collect-all textual --add-data "tuimail/app.tcss${{ matrix.sep }}tuimail" ${{ matrix.arch }} run.py
      - name: smoke test (posix)
        if: runner.os != 'Windows'
        run: ./dist/tuimail --check
      - name: smoke test (windows)
        if: runner.os == 'Windows'
        run: .\dist\tuimail.exe --check
      - name: package dmg
        if: runner.os == 'macOS'
        run: |
          mkdir dmgroot
          cp dist/tuimail dmgroot/tuimail
          cat > "dmgroot/Install tuimail.command" <<'EOF'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"
          echo "Installing tuimail to /usr/local/bin (your password may be asked)…"
          sudo mkdir -p /usr/local/bin
          sudo install -m 755 tuimail /usr/local/bin/tuimail
          sudo xattr -d com.apple.quarantine /usr/local/bin/tuimail 2>/dev/null || true
          echo "Done. Open a new terminal and run: tuimail"
          EOF
          chmod +x dmgroot/tuimail "dmgroot/Install tuimail.command"
          printf 'tuimail — mail, comfortably, in your terminal\n\nDouble-click "Install tuimail.command" to put the tuimail command on your\nPATH (right-click > Open the first time; the app is not code-signed).\nOr copy the tuimail binary anywhere yourself.\n' > dmgroot/README.txt
          hdiutil create -volname tuimail -srcfolder dmgroot -ov -format UDZO dist/tuimail-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/tuimail*

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: assemble assets
        run: |
          mkdir out
          mv art/tuimail-windows/tuimail.exe out/tuimail-windows.exe
          mv art/tuimail-macos-universal/tuimail out/tuimail-macos-universal
          mv art/tuimail-macos-universal/tuimail-macos.dmg out/tuimail-macos.dmg
      - name: publish releases
        run: |
          notes_for() { awk -v v="$1" 'index($0, "## " v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md; }

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            NOTES="$(notes_for "$V")"
            gh release create "$GITHUB_REF_NAME" out/* \
              --title "tuimail $GITHUB_REF_NAME" --notes "${NOTES:-Release $GITHUB_REF_NAME}"
            exit 0
          fi

          # rolling dev build, clearly marked so versioned releases stay the face
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --prerelease --latest=false \
            --title 'tuimail latest (rolling dev build)' \
            --notes "Rolling build of main (${GITHUB_SHA::7}). For stable downloads use the newest versioned release."

          # first push carrying a new pyproject version -> cut the vX.Y.Z release
          VERSION=$(grep -Po '(?<=^version = ")[^"]+' pyproject.toml)
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            NOTES="$(notes_for "$VERSION")"
            gh release create "v$VERSION" out/* --target "$GITHUB_SHA" \
              --title "tuimail v$VERSION" --notes "${NOTES:-Release v$VERSION}"
          fi
