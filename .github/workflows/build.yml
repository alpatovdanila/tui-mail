name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install textual
      - run: python tests/acceptance.py

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: tuimail-windows
            sep: ';'
            arch: ''
          - os: macos-latest
            # one universal2 binary covers Apple Silicon and Intel; GitHub has
            # no Intel mac runners any more (macos-13 jobs queue forever)
            artifact: tuimail-macos-universal
            sep: ':'
            arch: '--target-arch universal2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install textual pyinstaller
      - run: pyinstaller --onefile --console --name tuimail --collect-all textual --add-data "tuimail/app.tcss${{ matrix.sep }}tuimail" ${{ matrix.arch }} run.py
      - name: smoke test (posix)
        if: runner.os != 'Windows'
        run: ./dist/tuimail --check
      - name: smoke test (windows)
        if: runner.os == 'Windows'
        run: .\dist\tuimail.exe --check
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/tuimail*

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: assemble assets
        run: |
          mkdir out
          mv art/tuimail-windows/tuimail.exe out/tuimail-windows.exe
          mv art/tuimail-macos-universal/tuimail out/tuimail-macos-universal
      - name: publish release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG=latest; fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/* \
            --title "tuimail $TAG" \
            --notes "Automated build from ${GITHUB_SHA::7}. Assets: Windows exe, universal macOS binary (Apple Silicon + Intel). macOS: \`chmod +x tuimail-macos-universal && xattr -d com.apple.quarantine tuimail-macos-universal\`"
