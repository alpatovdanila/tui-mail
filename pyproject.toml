[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuimail"
version = "1.4.0"
description = "Mail, comfortably, in your terminal"
requires-python = ">=3.10"
dependencies = ["textual>=1.0", "certifi"]

[project.scripts]
tuimail = "tuimail.__main__:main"

[tool.setuptools]
packages = ["tuimail"]

[tool.setuptools.package-data]
tuimail = ["app.tcss"]
